name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/unity-environmental-university/scher-stacks

jobs:
  binaries:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            docker_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Built on Debian bookworm so the binary runs on the bookworm-slim image
    # (a build on ubuntu-24.04 would need a newer glibc than the image has).
    container: rust:1-bookworm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $have" >&2; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - run: cargo build --release --locked --bin scher-stacks
      - name: Package
        run: |
          name="scher-stacks-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/scher-stacks LICENSE README.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          mkdir -p image-bin && cp target/release/scher-stacks "image-bin/scher-stacks-${{ matrix.docker_arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: scher-stacks-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: image-bin-${{ matrix.docker_arch }}
          path: image-bin/*
          if-no-files-found: error

  image:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-bin-*
          path: image-bin
          merge-multiple: true
      - run: chmod +x image-bin/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: assets
          merge-multiple: true
      - name: Migrations tarball and checksums
        run: |
          tar -czf "assets/scher-stacks-${GITHUB_REF_NAME}-migrations.tar.gz" migrations
          cd assets && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* "${flags[@]}" --title "$GITHUB_REF_NAME"
