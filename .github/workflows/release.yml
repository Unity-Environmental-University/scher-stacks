# Release — on a pushed `v*` tag (e.g. v0.2.0). See RELEASING.md.
#
#   verify    tag must equal Cargo.toml's version (v0.2.0 <-> version = "0.2.0")
#   binaries  native builds on x86_64 and arm64 runners (no cross, no QEMU), --locked
#   image     the SAME binaries copied into a slim runtime image, pushed to GHCR
#   release   GitHub Release: binaries, migrations tarball, SHA256SUMS, generated notes
#
# The image is assembled from the release binaries rather than compiled again inside Docker, so
# the binary in the tarball and the binary in the container are byte-identical.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/unity-environmental-university/scher-stacks

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "tag=$TAG Cargo.toml=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi

  binaries:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) rather than 24.04 (2.39): the binary then runs on
          # Debian bookworm (2.36) and anything newer.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin scher-stacks
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="scher-stacks-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/scher-stacks README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Bare binary too, laid out by docker arch for the image job's COPY.
          mkdir -p "image/${{ matrix.arch }}"
          cp target/release/scher-stacks "image/${{ matrix.arch }}/scher-stacks"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            image/
          if-no-files-found: error

  image:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Make binaries executable
        run: chmod +x image/*/scher-stacks
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # ghcr.io/...:v0.2.0 (the git tag, verbatim) and :0.2.0; :latest only for
          # non-prerelease tags (metadata-action skips it for v0.2.0-rc.1 and the like).
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Migrations tarball and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "dist/scher-stacks-${TAG}-migrations.tar.gz" migrations
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
